<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeScript YouTube Channel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
      }
    }

    [data-theme="dark"] {
      --background: #17191c;
      --surface: #24272b;
      --text: #f1f3f5;
      --muted-text: #b8c0c8;
      --border: #3b4148;
      color-scheme: dark;
    }

    [data-theme="light"] {
      --background: #ffffff;
      --surface: #ffffff;
      --text: #363636;
      --muted-text: #7a7a7a;
      --border: #dbdbdb;
      color-scheme: light;
    }

    body {
      background: var(--background, #ffffff);
      color: var(--text, #363636);
    }

    [data-theme="dark"] .navbar,
    [data-theme="dark"] .card,
    [data-theme="dark"] .input,
    [data-theme="dark"] .box,
    [data-theme="dark"] .select select {
      background-color: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    [data-theme="dark"] .hero.is-light {
      background-color: #202327;
    }

    [data-theme="dark"] .has-text-grey {
      color: var(--muted-text) !important;
    }

    [data-theme="dark"] .tag.is-light,
    [data-theme="dark"] .button.is-light {
      background-color: #3a4047;
      color: var(--text);
    }

    [data-theme="dark"] .label,
    [data-theme="dark"] .title {
      color: var(--text);
    }

    .theme-toggle {
      align-items: center;
      background: #dfe5ea;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      height: 2rem;
      justify-content: space-between;
      overflow: hidden;
      padding: 0 0.45rem;
      position: relative;
      width: 4.25rem;
    }

    .theme-toggle input {
      height: 1px;
      opacity: 0;
      position: absolute;
      width: 1px;
    }

    .theme-toggle:focus-within {
      box-shadow: 0 0 0 0.125em rgba(50, 115, 220, 0.25);
    }

    .theme-toggle-icon {
      align-items: center;
      color: #5f6b76;
      display: inline-flex;
      font-size: 0.8rem;
      height: 1rem;
      justify-content: center;
      position: relative;
      z-index: 1;
      width: 1rem;
    }

    .theme-toggle-thumb {
      background: #ffffff;
      border-radius: 50%;
      height: 1.5rem;
      left: 0.25rem;
      position: absolute;
      top: 0.25rem;
      transition: transform 0.2s ease;
      width: 1.5rem;
    }

    .theme-toggle input:checked ~ .theme-toggle-thumb {
      transform: translateX(2.25rem);
    }

    [data-theme="dark"] .theme-toggle {
      background: #363c45;
    }

    [data-theme="dark"] .theme-toggle-icon {
      color: #d6dde5;
    }

    .video-card { height: 100%; transition: transform 0.2s; }
    .video-card:hover { transform: translateY(-5px); cursor: pointer; }
    .yt-logo { cursor: pointer; }
    
    /* Clamp title to 2 lines & maintain equal card height */
    .video-title {
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.8em; 
      line-height: 1.4;
    }

    /* Video Player Styling */
    .player-container video {
      border-radius: 8px;
      width: 100%;
      background-color: #000;
    }

    .watch-description-box {
      padding: 0;
    }

    .watch-description {
      margin: 0;
    }

    .watch-meta {
      margin-top: 0 !important;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar is-white has-shadow" role="navigation" aria-label="main navigation">
    <div class="container">
      <div class="navbar-brand">
        <a class="navbar-item yt-logo" id="yt-logo" title="Reload Page">
          <span class="icon is-large has-text-danger">
            <i class="fab fa-youtube fa-2x"></i>
          </span>
          <span class="title is-4 ml-2 mb-0">MyTube</span>
        </a>
      </div>
      <div class="navbar-end">
        <div class="navbar-item">
          <label class="theme-toggle" for="dark-mode-toggle" title="Toggle dark mode">
            <input id="dark-mode-toggle" type="checkbox" aria-label="Toggle dark mode">
            <span class="theme-toggle-icon"><i class="fas fa-lightbulb" aria-hidden="true"></i></span>
            <span class="theme-toggle-icon"><i class="fas fa-moon" aria-hidden="true"></i></span>
            <span class="theme-toggle-thumb" aria-hidden="true"></span>
          </label>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN GRID VIEW (Channel Header + Controls + Video List) -->
  <div id="grid-view">
    <!-- Fixed Channel Header -->
    <section class="hero is-light is-small">
      <div class="hero-body">
        <div class="container is-flex is-align-items-center is-justify-content-space-between">
          <div class="is-flex is-align-items-center">
            <figure class="image is-64x64 mr-4">
              <img class="is-rounded" src="https://ui-avatars.com/api/?name=Dev+Channel&background=random" alt="Channel Avatar">
            </figure>
            <div>
              <h1 class="title is-3 mb-1">Developer Channel</h1>
              <p class="is-size-6 has-text-grey">1.2M subscribers • 42 Videos</p>
            </div>
          </div>
          <button id="subscribe-btn" class="button is-danger is-rounded has-text-weight-bold">
            Subscribe
          </button>
        </div>
      </div>
    </section>

    <!-- Controls -->
    <section class="section pt-4 pb-4">
      <div class="container">
        <div class="columns is-vcentered">
          
          <div class="column is-4">
            <div class="control has-icons-left">
              <input id="search-input" class="input is-rounded" type="text" placeholder="Search videos...">
              <span class="icon is-left"><i class="fas fa-search"></i></span>
            </div>
          </div>

          <div class="column is-3">
            <div class="field is-horizontal">
              <div class="field-label is-normal"><label class="label">Filter:</label></div>
              <div class="field-body">
                <div class="select is-rounded is-fullwidth">
                  <select id="filter-select">
                    <option value="All">All Categories</option>
                    <option value="Tutorial">Tutorials</option>
                    <option value="Vlog">Vlogs</option>
                    <option value="Review">Reviews</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="column is-3">
            <div class="field is-horizontal">
              <div class="field-label is-normal"><label class="label">Sort:</label></div>
              <div class="field-body">
                <div class="select is-rounded is-fullwidth">
                  <select id="sort-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="views-high">Most Popular</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- Videos Grid -->
    <section class="section pt-0">
      <div class="container">
        <div id="video-grid" class="columns is-multiline"></div>
      </div>
    </section>
  </div>

  <!-- YOUTUBE WATCH VIEW (Hidden by Default) -->
  <div id="watch-view" class="section is-hidden pt-4">
    <div class="container">
      <button id="back-btn" class="button is-light mb-4 is-rounded">
        <span class="icon"><i class="fas fa-arrow-left"></i></span>
        <span>Back to Channel</span>
      </button>

      <div class="columns">
        <!-- Primary Player View -->
        <div class="column is-8">
          <div class="player-container mb-3">
            <figure class="image is-16by9">
              <video id="main-video-player" controls autoplay muted playsinline class="has-ratio">
                <source id="video-source" src="" type="video/mp4">
                Your browser does not support the video tag.
              </video>
            </figure>
          </div>
          <h1 id="watch-title" class="title is-4 mb-2"></h1>
          <p id="watch-meta" class="subtitle is-6 has-text-grey mb-3 watch-meta"></p>
          <div class="watch-description-box">
            <p id="watch-description" class="watch-description"></p>
          </div>
        </div>

        <!-- Sidebar / Suggested Videos -->
        <div class="column is-4">
          <h2 class="title is-5 mb-3">Up Next</h2>
          <div id="sidebar-video-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="dist/src/app.js"></script>
</body>
</html>
